// ==================== 影视 Subscription Sources ====================

// How to read a source endpoint. Closed set: the client has one adapter per
// value, and a source it cannot parse is a source nothing can play.
enum VodSourceFormat {
  VOD_SOURCE_FORMAT_UNSPECIFIED = 0;
  // MacCMS / CMS10 JSON.
  VOD_SOURCE_FORMAT_MACCMS_JSON = 1;
  // The same API rendered as XML.
  VOD_SOURCE_FORMAT_MACCMS_XML = 2;
  // A flat M3U playlist where `group-title` carries the category.
  VOD_SOURCE_FORMAT_M3U = 3;
}

message VodSource {
  string id = 1;
  string name = 2;
  VodSourceFormat format = 3;
  string endpoint = 4;
  // Sent with every catalog request. A browser build drops these — it cannot
  // set `User-Agent` or `Referer` — so a source needing them is native-only.
  map<string, string> headers = 5;
  int32 sort_order = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message ListVodSourcesRequest {}

message ListVodSourcesResponse {
  // Enabled entries only, in the order the administrator set.
  repeated VodSource sources = 1;
}

// ==================== 爱的小窝 ====================

enum CoupleMediaKind {
  COUPLE_MEDIA_KIND_UNSPECIFIED = 0;
  COUPLE_MEDIA_KIND_PHOTO = 1;
  COUPLE_MEDIA_KIND_VIDEO = 2;
}

enum CoupleAiKind {
  COUPLE_AI_KIND_UNSPECIFIED = 0;
  COUPLE_AI_KIND_DATE_PLAN = 1;
  COUPLE_AI_KIND_DIARY = 2;
  COUPLE_AI_KIND_LOVE_LETTER = 3;
}

enum CouplePetAction {
  COUPLE_PET_ACTION_UNSPECIFIED = 0;
  COUPLE_PET_ACTION_FEED = 1;
  COUPLE_PET_ACTION_PLAY = 2;
  COUPLE_PET_ACTION_PET = 3;
}

// One photo or video in the nest. `objectKey` identifies the blob in file
// storage; the client resolves it to a URL the same way it does an avatar.
message CoupleMedia {
  string id = 1;
  string album_id = 2;
  string memory_id = 3;
  string uploader_user_id = 4;
  CoupleMediaKind kind = 5;
  string storage_backend = 6;
  string object_key = 7;
  string mime_type = 8;
  int64 size_bytes = 9;
  int32 width = 10;
  int32 height = 11;
  // `YYYY-MM-DD`, empty when the capture date is unknown.
  string taken_on = 12;
  string caption = 13;
  int64 created_at = 14;
  // Where the bytes are, on this server. A path rather than a signed URL: the
  // route authenticates the caller and checks space membership, so nothing
  // private ends up in a link that can be forwarded, logged or refererred.
  string url = 15;
}

// 时光轴 entry. `happenedOn` is the day being remembered, not the day it was
// written — the timeline orders by the former.
message CoupleMemory {
  string id = 1;
  string author_user_id = 2;
  string happened_on = 3;
  string title = 4;
  string content = 5;
  string location = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  repeated CoupleMedia media = 9;
}

message CoupleAlbum {
  string id = 1;
  string created_by_user_id = 2;
  string name = 3;
  int64 created_at = 4;
  int32 media_count = 5;
  // Newest item, for the shelf tile. Absent while the album is empty.
  CoupleMedia cover = 6;
}

message CoupleAnniversary {
  string id = 1;
  string created_by_user_id = 2;
  string title = 3;
  string happens_on = 4;
  bool repeat_yearly = 5;
  string note = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  // The next time it comes round, already resolved through the repeat rule.
  string next_occurrence_on = 9;
  // Negative once a one-off has passed.
  int32 days_until = 10;
}

message CoupleTodo {
  string id = 1;
  string created_by_user_id = 2;
  string title = 3;
  string note = 4;
  string category = 5;
  int32 priority = 6;
  string plan_date = 7;
  string done_by_user_id = 8;
  int64 done_at = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

// The pet as it is now. Hunger and mood are decayed to the moment of reading,
// so a pet left alone is already hungry when the screen opens.
message CouplePet {
  string name = 1;
  int32 species = 2;
  int32 skin = 3;
  int32 accessory = 4;
  int32 stage = 5;
  int32 experience = 6;
  int32 hunger = 7;
  int32 mood = 8;
  int32 streak_days = 9;
  bool both_checked_in_today = 10;
  int32 experience_into_stage = 11;
  int32 experience_for_next_stage = 12;
  int64 created_at = 13;
}

message CouplePetDay {
  string on_date = 1;
  // How many of the two members were in that day.
  int32 members = 2;
  int32 interactions = 3;
}

message CoupleAiWork {
  string id = 1;
  string author_user_id = 2;
  CoupleAiKind kind = 3;
  string title = 4;
  // What was asked, as JSON, so a piece can be explained or regenerated.
  string prompt_json = 5;
  string content = 6;
  int64 created_at = 7;
}

