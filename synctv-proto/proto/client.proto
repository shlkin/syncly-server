// ==================== Daily check-in and points ====================

enum CheckInAwardMode {
  CHECK_IN_AWARD_MODE_UNSPECIFIED = 0;
  // Every claim awards fixed_points.
  CHECK_IN_AWARD_MODE_FIXED = 1;
  // Every claim draws uniformly from the configured inclusive range.
  CHECK_IN_AWARD_MODE_RANDOM = 2;
}

// The server-wide check-in rules. Readable by any account so the card can render
// what a claim is worth; only admins may change it.
message CheckInConfig {
  // False disables claiming entirely; the card still renders.
  bool enabled = 1;
  CheckInAwardMode award_mode = 2;
  int32 fixed_points = 3;
  int32 random_min_points = 4;
  int32 random_max_points = 5;
  // Minutes east of UTC that decide which calendar day a claim lands on.
  int32 day_boundary_offset_minutes = 6;
  int64 updated_at = 7;
  // Empty while the defaults have never been edited.
  string updated_by_user_id = 8;
}
message GetCheckInStatusRequest {}

message GetCheckInStatusResponse {
  CheckInConfig config = 1;
  // The calendar day (YYYY-MM-DD) the server would credit a claim to right now.
  string today = 2;
  bool checked_in_today = 3;
  // Consecutive days including today when already claimed, else the streak a
  // claim today would continue.
  int32 streak = 4;
  // Empty when the account has never claimed.
  string last_check_in_date = 5;
  int64 balance = 6;
  int64 total_earned = 7;
}

message ClaimCheckInRequest {}

message ClaimCheckInResponse {
  string check_in_date = 1;
  int32 points_awarded = 2;
  int32 streak = 3;
  int64 balance = 4;
  int64 total_earned = 5;
  // True when today's claim already existed. The response then describes that
  // earlier claim and awards nothing, so a retry is not a failure.
  bool already_checked_in = 6;
}

// One movement of the points balance.
message PointTransaction {
  string id = 1;
  // Signed: positive for awards, negative for spending.
  int64 delta = 2;
  int64 balance_after = 3;
  // Machine-readable cause, e.g. "check_in".
  string reason = 4;
  string description = 5;
  int64 created_at = 6;
}

message ListPointTransactionsRequest {
  option (buf.validate.message).cel = {
    id: "list_point_transactions.page"
    message: "page must be 0 (use default) or at least 1"
    expression: "this.page == 0 || this.page >= 1"
  };
  option (buf.validate.message).cel = {
    id: "list_point_transactions.page_size"
    message: "page_size must be 0 (use default) or between 1 and 100"
    expression: "this.page_size == 0 || (this.page_size >= 1 && this.page_size <= 100)"
  };
  int32 page = 1;
  int32 page_size = 2;
}
message ListPointTransactionsResponse {
  repeated PointTransaction transactions = 1;
  int32 total = 2;
}

// ==================== 礼物 (gifts) ====================

// One catalog entry. Prices are in the same points the check-in awards.
message Gift {
  string id = 1;
  // Stable machine key, e.g. "flower". Records snapshot it, so it never changes.
  string key = 2;
  string name = 3;
  string description = 4;
  // Usually a single emoji; may be a URL.
  string icon = 5;
  int32 price_points = 6;
  int32 sort_order = 7;
  bool is_enabled = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  // Empty until an admin has edited the entry.
  string updated_by_user_id = 11;
}

message ListGiftsRequest {}

message ListGiftsResponse {
  // Enabled entries only, in display order.
  repeated Gift gifts = 1;
  // The caller's balance, so a send panel can grey out what they cannot afford.
  int64 balance = 2;
}

message SendGiftRequest {
  string recipient_user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^usr_[A-Za-z0-9]+$"
  }];
  string gift_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^gift_[A-Za-z0-9]+$"
  }];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 99}];
  // Optional note shown with the gift.
  string message = 4 [(buf.validate.field).string = {max_len: 200}];
  // Set to announce the send in that room's chat; the recipient must be a
  // member. Empty sends from a profile page, with no announcement.
  string room_id = 5 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^(room_[A-Za-z0-9]+)?$"
  }];
  // Retry key. Repeating one returns the earlier send instead of charging again.
  string request_id = 6 [(buf.validate.field).string = {max_len: 64}];
}

// One completed send. The catalog fields are the snapshot taken at send time, so
// a later rename or repricing does not rewrite history.
message GiftRecord {
  string id = 1;
  string sender_user_id = 2;
  string sender_username = 3;
  // Empty when the recipient account has since been deleted.
  string recipient_user_id = 4;
  string recipient_username = 5;
  // Empty for a send that did not happen in a room.
  string room_id = 6;
  string gift_key = 7;
  string gift_name = 8;
  string gift_icon = 9;
  int32 unit_price_points = 10;
  int32 quantity = 11;
  int64 total_points = 12;
  string message = 13;
  int64 created_at = 14;
}

message SendGiftResponse {
  GiftRecord record = 1;
  // The sender's balance after the debit.
  int64 balance = 2;
  // True when this request_id had already been sent. The response then describes
  // that earlier send and charges nothing, so a retry is not a failure.
  bool already_sent = 3;
}

enum GiftRecordDirection {
  GIFT_RECORD_DIRECTION_UNSPECIFIED = 0;
  GIFT_RECORD_DIRECTION_SENT = 1;
  GIFT_RECORD_DIRECTION_RECEIVED = 2;
}

message ListGiftRecordsRequest {
  option (buf.validate.message).cel = {
    id: "list_gift_records.page"
    message: "page must be 0 (use default) or at least 1"
    expression: "this.page == 0 || this.page >= 1"
  };
  option (buf.validate.message).cel = {
    id: "list_gift_records.page_size"
    message: "page_size must be 0 (use default) or between 1 and 100"
    expression: "this.page_size == 0 || (this.page_size >= 1 && this.page_size <= 100)"
  };
  // Unspecified reads what the caller has sent.
  GiftRecordDirection direction = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// People search: the only way in the app to reach an account you do not
// already follow. Matches usernames only — an email would let a search confirm
// an address someone never published.
message SearchUsersRequest {
  option (buf.validate.message).cel = {
    id: "search_users.page"
    message: "page must be 0 (use default) or at least 1"
    expression: "this.page == 0 || this.page >= 1"
  };
  option (buf.validate.message).cel = {
    id: "search_users.page_size"
    message: "page_size must be 0 (use default) or between 1 and 50"
    expression: "this.page_size == 0 || (this.page_size >= 1 && this.page_size <= 50)"
  };

  string query = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  int32 page = 2;
  int32 page_size = 3;
}

message UserSearchResult {
  UserPublicView user = 1;
  // Where the caller already stands with this account, so the row can offer the
  // one action that is left rather than a request that will be rejected.
  bool is_friend = 2;
  bool request_sent = 3;
  bool request_received = 4;
  bool is_following = 5;
}

message SearchUsersResponse {
  repeated UserSearchResult results = 1;
  int32 total = 2;
}

message GetPrivacySettingsRequest {}

message PrivacySettings {
  // Off hides the account from SearchUsers. It does not hide the profile from
  // someone who already has the link.
  bool discoverable = 1;
  // Whether anyone but the owner may open the following / followers lists.
