message UnbindCoupleSpaceResponse {
  bool success = 1;
}

message UpdateCoupleSpaceRequest {
  string space_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^cpl_[A-Za-z0-9]+$"
  }];
  // Omitted fields are left as they are.
