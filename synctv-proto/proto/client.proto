// ==================== 情侣空间 (couple space) ====================

enum CoupleSpaceStatus {
  COUPLE_SPACE_STATUS_UNSPECIFIED = 0;
  // Invited, not yet accepted. Nothing is shared yet.
  COUPLE_SPACE_STATUS_PENDING = 1;
  COUPLE_SPACE_STATUS_ACTIVE = 2;
  // Unbound by either side. Kept readable, but no longer writable.
  COUPLE_SPACE_STATUS_ENDED = 3;
}

message CoupleSpace {
  string id = 1;
  string initiator_user_id = 2;
  string partner_user_id = 3;
  CoupleSpaceStatus status = 4;
  string title = 5;
  string invite_message = 6;
  // YYYY-MM-DD the "在一起 N 天" counter starts from; empty until bound.
  string anniversary_date = 7;
  int64 created_at = 8;
  // Zero until bound, and until ended, respectively.
  int64 bound_at = 9;
  int64 ended_at = 10;
}

message CoupleSpaceView {
  CoupleSpace space = 1;
  // The other account, whichever column it sits in.
  UserPublicView partner = 2;
  // True when the reader sent the invite: the pending screen differs, since the
  // initiator can only withdraw while the partner can accept or decline.
  bool viewer_is_initiator = 3;
  // Whole days from the anniversary to today, inclusive. Zero until bound.
  int64 days_together = 4;
  int64 favorite_count = 5;
  // How many titles both members have in their watch history.
  int64 shared_watch_count = 6;
}

message GetCoupleSpaceRequest {}

message GetCoupleSpaceResponse {
  // Absent when the account has neither an active space nor a pending invite,
  // which is the card's empty state.
  CoupleSpaceView space = 1;
}
