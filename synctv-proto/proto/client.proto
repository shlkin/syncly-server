// ==================== Friends ====================

enum FriendRequestStatus {
  FRIEND_REQUEST_STATUS_UNSPECIFIED = 0;
  FRIEND_REQUEST_STATUS_PENDING = 1;
  FRIEND_REQUEST_STATUS_ACCEPTED = 2;
  FRIEND_REQUEST_STATUS_DECLINED = 3;
  // Withdrawn by the requester before the other side answered.
  FRIEND_REQUEST_STATUS_CANCELLED = 4;
}

enum FriendRequestDirection {
  FRIEND_REQUEST_DIRECTION_UNSPECIFIED = 0;
  // Someone asked the reader.
  FRIEND_REQUEST_DIRECTION_INCOMING = 1;
  // The reader asked someone.
  FRIEND_REQUEST_DIRECTION_OUTGOING = 2;
}
message FriendRequest {
  string id = 1;
  // The other account, from the reader's point of view.
  UserPublicView counterpart = 2;
  FriendRequestDirection direction = 3;
  string message = 4;
  FriendRequestStatus status = 5;
  int64 created_at = 6;
  // Zero while still pending.
  int64 responded_at = 7;
}

message Friend {
  UserPublicView user = 1;
  int64 friended_at = 2;
}

message SendFriendRequestRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^usr_[A-Za-z0-9]+$"
  }];
  string message = 2 [(buf.validate.field).string = {max_len: 200}];
}

message SendFriendRequestResponse {
  // True when the other side had already asked: two people asking each other is
  // mutual consent, so the request is settled at once instead of waiting in an
  // inbox that would confuse both.
  bool accepted = 1;
  // Set while pending.
  string request_id = 2;
  // Set when accepted, along with the direct thread the two now share.
  Friend friend = 3;
  string conversation_id = 4;
}

message AcceptFriendRequestRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^frq_[A-Za-z0-9]+$"
  }];
}

message AcceptFriendRequestResponse {
  Friend friend = 1;
  string conversation_id = 2;
}
message DeclineFriendRequestRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^frq_[A-Za-z0-9]+$"
  }];
}

message DeclineFriendRequestResponse {
  bool success = 1;
}

// Withdraws a request the caller sent.
message CancelFriendRequestRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^frq_[A-Za-z0-9]+$"
  }];
}

message CancelFriendRequestResponse {
  bool success = 1;
}

message ListFriendRequestsRequest {
  option (buf.validate.message).cel = {
    id: "list_friend_requests.page"
    message: "page must be 0 (use default) or at least 1"
    expression: "this.page == 0 || this.page >= 1"
  };
  option (buf.validate.message).cel = {
    id: "list_friend_requests.page_size"
    message: "page_size must be 0 (use default) or between 1 and 100"
    expression: "this.page_size == 0 || (this.page_size >= 1 && this.page_size <= 100)"
  };
  // Defaults to incoming, which is the inbox the badge counts.
  FriendRequestDirection direction = 1 [(buf.validate.field).enum.defined_only = true];
  int32 page = 2;
  int32 page_size = 3;
}

message ListFriendRequestsResponse {
  repeated FriendRequest requests = 1;
  int32 total = 2;
}
message ListFriendsRequest {
  option (buf.validate.message).cel = {
    id: "list_friends.page"
    message: "page must be 0 (use default) or at least 1"
    expression: "this.page == 0 || this.page >= 1"
  };
  option (buf.validate.message).cel = {
    id: "list_friends.page_size"
    message: "page_size must be 0 (use default) or between 1 and 100"
    expression: "this.page_size == 0 || (this.page_size >= 1 && this.page_size <= 100)"
  };
  int32 page = 1;
  int32 page_size = 2;
  string search = 3 [(buf.validate.field).string = {max_len: 100}];
}

message ListFriendsResponse {
  repeated Friend friends = 1;
  int32 total = 2;
}

// Drops the friendship from both sides. The direct thread survives, unwritable
// while the two are not friends.
message RemoveFriendRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^usr_[A-Za-z0-9]+$"
  }];
}

message RemoveFriendResponse {
  bool success = 1;
}

// The badge numbers for the 消息 tab.
message GetSocialUnreadSummaryRequest {}

message GetSocialUnreadSummaryResponse {
  int64 unread_message_count = 1;
  // Threads with at least one unread message, for a "N 个会话" line.
  int64 unread_conversation_count = 2;
  int64 pending_friend_request_count = 3;
}
// ==================== Conversations (direct threads and groups) ====================

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  // Exactly two members, created on demand between friends.
  CONVERSATION_KIND_DIRECT = 1;
  // Owner plus invited members, with a title.
  CONVERSATION_KIND_GROUP = 2;
}

enum ConversationMemberRole {
  CONVERSATION_MEMBER_ROLE_UNSPECIFIED = 0;
  CONVERSATION_MEMBER_ROLE_MEMBER = 1;
  // May add and remove members; may not delete the group.
  CONVERSATION_MEMBER_ROLE_ADMIN = 2;
  CONVERSATION_MEMBER_ROLE_OWNER = 3;
}

enum SocialMessageKind {
  SOCIAL_MESSAGE_KIND_UNSPECIFIED = 0;
  SOCIAL_MESSAGE_KIND_TEXT = 1;
  SOCIAL_MESSAGE_KIND_SYSTEM = 2;
}

message SocialMessage {
  string id = 1;
  string conversation_id = 2;
  // Absent for system lines, and for text whose author has been deleted.
  UserPublicView sender = 3;
  SocialMessageKind kind = 4;
  // Empty when deleted is true: a removed message keeps its place in the id
  // sequence because every member's read cursor is an id in it.
  string body = 5;
  int64 created_at = 6;
  bool deleted = 7;
}

message ConversationMember {
  UserPublicView user = 1;
  ConversationMemberRole role = 2;
  int64 joined_at = 3;
}
message ConversationSummary {
  string id = 1;
  ConversationKind kind = 2;
  // Empty for direct threads, which render as counterpart.
  string title = 3;
  string owner_user_id = 4;
  // The other participant of a direct thread; absent for a group.
  UserPublicView counterpart = 5;
  int64 member_count = 6;
  ConversationMemberRole viewer_role = 7;
  bool muted = 8;
  int64 unread_count = 9;
  SocialMessage last_message = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

// Opens the direct thread with a friend, creating it on first use.
message OpenDirectConversationRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^usr_[A-Za-z0-9]+$"
  }];
}

message OpenDirectConversationResponse {
  ConversationSummary conversation = 1;
}

message CreateGroupConversationRequest {
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Accounts invited at creation, excluding the creator. Non-friends are
  // rejected, so a group starts from people the creator already knows.
  repeated string member_user_ids = 2 [(buf.validate.field).repeated = {
    max_items: 199
    items: {
      string: {
        min_len: 1
        max_len: 64
        pattern: "^usr_[A-Za-z0-9]+$"
      }
    }
  }];
}
message CreateGroupConversationResponse {
  ConversationSummary conversation = 1;
}

message ListConversationsRequest {
  option (buf.validate.message).cel = {
