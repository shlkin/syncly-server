    FnosPlaybackMetadata fnos = 15;
    QnapPlaybackMetadata qnap = 16;
    SynologyPlaybackMetadata synology = 17;
    NextcloudPlaybackMetadata nextcloud = 18;
    SeafilePlaybackMetadata seafile = 19;
    TrueNasPlaybackMetadata truenas = 20;
  }
}

