    expression: "this.limit == 0 || (this.limit >= 1 && this.limit <= 100)"
  };
  string conversation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^conv_[A-Za-z0-9]+$"
  }];
  string before_message_id = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^(smsg_[A-Za-z0-9]+)?$"
